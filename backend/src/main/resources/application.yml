server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: inkgrade-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inkgrade}
    username: ${DB_USER:inkgrade}
    password: ${DB_PASSWORD:inkgrade}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    root: ${STORAGE_ROOT:./uploads}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:300}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
    email: ${ADMIN_EMAIL:admin@inkgrade.local}
  seed-demo: ${SEED_DEMO:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
